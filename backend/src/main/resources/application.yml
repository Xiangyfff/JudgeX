server:
  port: ${JUDGEX_PORT:18900}
  address: 127.0.0.1
  compression:
    enabled: true

spring:
  application:
    name: judgex
  datasource:
    # MySQL 8. The schema itself is owned by Flyway (db/migration), not by JPA or schema.sql.
    url: ${JUDGEX_DB_URL:jdbc:mysql://127.0.0.1:3306/judgex?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${JUDGEX_DB_USER:judgex}
    password: ${JUDGEX_DB_PASSWORD:judgex}
    hikari:
      maximum-pool-size: 24
      pool-name: judgex-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A database that already has data (but no flyway_schema_history yet) is adopted at V1.
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 120000
  task:
    scheduling:
      pool:
        # Relay, lease renewal and heartbeat must not starve each other.
        size: 6
  data:
    redis:
      host: ${JUDGEX_REDIS_HOST:127.0.0.1}
      port: ${JUDGEX_REDIS_PORT:6379}
      timeout: 800ms
      connect-timeout: 800ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

judgex:
  # HS256 secret. Replace in production.
  jwt-secret: ${JUDGEX_JWT_SECRET:judgex-dev-secret-please-change-in-production-0123456789}
  token-ttl-hours: 12
  # Origins allowed to call /api from another origin. A same-origin deployment (Nginx
  # serves the SPA and proxies /api) never triggers CORS at all; this only matters for
  # split deployments. Comma separated. Wildcards are ignored when credentials are on.
  cors:
    allowed-origins: ${JUDGEX_CORS_ORIGINS:http://127.0.0.1:*,http://localhost:*}
  # How many judge threads this node runs. Each thread = one worker slot.
  worker:
    id: ${JUDGEX_WORKER_ID:node-1}
    concurrency: ${JUDGEX_WORKER_CONCURRENCY:4}
    enabled: ${JUDGEX_WORKER_ENABLED:true}
    heartbeat-interval-ms: 3000
    lease-seconds: 45
    # The dispatcher sleeps until a "task queued" message arrives. This is only the
    # fallback cadence for when the broker is unreachable (every task then waits <= this).
    idle-poll-ms: ${JUDGEX_IDLE_POLL_MS:2000}
    # Third line of defence: leases whose alarm message was lost are still reclaimed here.
    safety-sweep-ms: 60000
  sandbox:
    # local | docker | auto
    mode: ${JUDGEX_SANDBOX:local}
    max-output-bytes: 65536
    work-dir: ${JUDGEX_WORK_DIR:./data/work}
    docker-image: judgex-runner:latest
    # Judge programs run as nobody, never as root. On Windows the Docker Desktop bind
    # mount is world-writable, so the compile step can still write into /work.
    run-as-user: ${JUDGEX_SANDBOX_USER:65534:65534}
    # Blank = use the profile packaged from docker/runner/seccomp.json.
    seccomp-profile: ${JUDGEX_SECCOMP_PROFILE:}
    # The outer timer is a fuse, not a verdict: TLE is decided from the runtime measured inside
    # the sandbox, so booting the container is never charged to the submission. The fuse only
    # has to be comfortably longer than limit + startup, or a slow boot would kill correct runs.
    startup-allowance-ms: ${JUDGEX_SANDBOX_STARTUP_ALLOWANCE_MS:3000}
    # Local mode starts the process directly; it needs far less headroom.
    local-startup-allowance-ms: ${JUDGEX_SANDBOX_LOCAL_STARTUP_ALLOWANCE_MS:500}
  limits:
    max-source-bytes: 65536
    max-active-per-user: 1
    submit-rate-per-minute: ${JUDGEX_SUBMIT_RATE:20}
  # First boot only: writes the demo users and problems when those tables are empty.
  # On a public install either disable this or supply real passwords through env vars.
  seed:
    enabled: ${JUDGEX_SEED_ENABLED:true}
    admin-password: ${JUDGEX_ADMIN_PASSWORD:admin123}
    student-password: ${JUDGEX_STUDENT_PASSWORD:student123}
  redis:
    # Redis only ever holds state we can rebuild (counters, presence, ranking).
    # Tasks and verdicts stay in the database, so a Redis outage degrades instead of corrupting.
    enabled: ${JUDGEX_REDIS_ENABLED:true}
    key-prefix: "jx:"
  mq:
    # Transactional outbox: the verdict and the outbox row are committed in one transaction,
    # then a relay delivers the row to RocketMQ. Broker down => rows simply wait in the table.
    enabled: ${JUDGEX_MQ_ENABLED:true}
    namesrv: ${JUDGEX_MQ_NAMESRV:127.0.0.1:19877}
    # Three jobs, three topics. Only `topic` is lossless (it is fed by the outbox);
    # `task-topic` and `lease-topic` are pings - losing one costs seconds, never a verdict.
    topic: ${JUDGEX_MQ_TOPIC:judgex-result}
    task-topic: ${JUDGEX_MQ_TASK_TOPIC:judgex-task}
    lease-topic: ${JUDGEX_MQ_LEASE_TOPIC:judgex-lease}
    producer-group: judgex-producer
    consumer-group: judgex-notify
    dispatch-group: judgex-dispatch
    lease-group: judgex-lease-guard
    # 4 = 30s. Lease is 45s, so the alarm fires early and re-arms itself for the remainder.
    lease-delay-level: 4
    max-attempts: 6

logging:
  level:
    root: INFO
    com.judgex: INFO
    # The queue poll runs every 250ms and the outbox relay every 400ms; at DEBUG each statement
    # writes four lines, which is pure noise (and measurable overhead) on an idle worker.
    com.judgex.repo: WARN
    com.judgex.mq: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
