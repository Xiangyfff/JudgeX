brokerClusterName=judgex
brokerName=judgex-broker-a
brokerId=0

# 客户端从 namesrv 拿到的是这个地址；宿主机（Spring Boot 进程）据此回连。
brokerIP1=127.0.0.1
listenPort=10913
namesrvAddr=judgex-mq-namesrv:9876

autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48
storePathRootDir=/home/rocketmq/store
