# JudgeX — Nginx front door.
#
# The SPA and the API share one origin, so no CORS is involved at all: the browser
# talks to https://your-domain, Nginx serves the static build and proxies /api to the
# Java process listening on 127.0.0.1:18900.
#
#   /etc/nginx/sites-available/judgex.conf  ->  ln -s ../sites-available/judgex.conf sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    root /opt/judgex/frontend/dist;
    index index.html;

    client_max_body_size 1m;      # submissions are capped at 64 KB by the backend

    # SPA fallback: /problems/3 must return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names may be cached forever; index.html must not be.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- the three lines that make server-sent events work ----
        # Without them Nginx buffers the judge progress stream and the page sits
        # silent until the connection times out.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        # 300s covers the 180s emitter timeout inside the app plus slack.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
